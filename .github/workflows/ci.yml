name: CI - Go Serverless Notification Rate Limiter

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test & Race Detection (Go 1.21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: go.sum

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

      - name: Compile Lambda Binary (Linux amd64)
        run: |
          mkdir -p bin
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/send-notification ./send-notification/v1
